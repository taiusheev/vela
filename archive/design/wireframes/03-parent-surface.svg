<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Helvetica, Arial, sans-serif">
  <rect width="390" height="844" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="20" y="40" font-size="11" fill="#7d8794">03 · PARENT SURFACE (same app, simplified) · also kitchen-table mode</text>

  <text x="195" y="100" font-size="28" text-anchor="middle" fill="#1b2430">Good morning,</text>
  <text x="195" y="136" font-size="28" text-anchor="middle" fill="#1b2430">Mrs Ivanova</text>

  <!-- big photo -->
  <rect x="30" y="170" width="330" height="300" rx="16" fill="#e8ecf1"/>
  <text x="195" y="325" font-size="14" text-anchor="middle" fill="#7d8794">photo from Mia · yesterday</text>
  <rect x="30" y="484" width="330" height="60" rx="12" fill="#f6f7f9"/>
  <text x="195" y="512" font-size="16" text-anchor="middle" fill="#1b2430">Mia: "Grandma, this is my drawing!"</text>
  <text x="195" y="532" font-size="13" text-anchor="middle" fill="#7d8794">▶ listen (0:09)</text>

  <!-- one big button -->
  <rect x="30" y="580" width="330" height="84" rx="20" fill="#2f7d5b"/>
  <text x="195" y="632" font-size="26" text-anchor="middle" fill="#ffffff" font-weight="600">☀️ I'm fine</text>

  <!-- voice + call -->
  <rect x="30" y="680" width="158" height="70" rx="16" fill="#f6f7f9" stroke="#cfd4dc"/>
  <text x="109" y="722" font-size="18" text-anchor="middle" fill="#1b2430">🎤 Reply</text>
  <rect x="202" y="680" width="158" height="70" rx="16" fill="#f6f7f9" stroke="#cfd4dc"/>
  <text x="281" y="722" font-size="18" text-anchor="middle" fill="#1b2430">📞 Call Anna</text>

  <text x="195" y="790" font-size="12" text-anchor="middle" fill="#7d8794">Family only. Nothing else on this screen.</text>
  <text x="195" y="812" font-size="12" text-anchor="middle" fill="#7d8794">"What the family sees" · "Stop"</text>
</svg>
