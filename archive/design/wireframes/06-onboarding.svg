<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="844" fill="#f6f7f9"/>
  <text x="20" y="34" font-size="11" fill="#7d8794">06 · ONBOARDING (organiser) · three screens, then the invite</text>

  <!-- screen A -->
  <g transform="translate(20,60)">
    <rect width="360" height="760" rx="18" fill="#ffffff" stroke="#cfd4dc"/>
    <text x="24" y="60" font-size="11" fill="#7d8794" letter-spacing="1">1 / 3 · YOUR FAMILY</text>
    <text x="24" y="100" font-size="22" fill="#1b2430" font-weight="600">Who do you want to</text>
    <text x="24" y="128" font-size="22" fill="#1b2430" font-weight="600">keep a light on for?</text>
    <text x="24" y="156" font-size="12" fill="#7d8794">Anyone who lives alone or far away. More than one is fine.</text>
    <rect x="24" y="180" width="312" height="60" rx="12" fill="#fbf0d8" stroke="#e0a23a"/>
    <text x="40" y="216" font-size="14" fill="#1b2430">Mom · Galina · 78 · Irkutsk</text>
    <rect x="24" y="252" width="312" height="60" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="40" y="288" font-size="14" fill="#7d8794">+ Add someone (Dad, a student abroad…)</text>
    <text x="24" y="350" font-size="11" fill="#7d8794" letter-spacing="1">HOW TO ADDRESS HER</text>
    <rect x="24" y="362" width="312" height="48" rx="10" fill="#ffffff" stroke="#cfd4dc"/>
    <text x="40" y="392" font-size="14" fill="#1b2430">Galina Petrovna</text>
    <text x="24" y="440" font-size="11" fill="#7d8794" letter-spacing="1">WHEN SHE USUALLY WAKES UP</text>
    <rect x="24" y="452" width="312" height="48" rx="10" fill="#ffffff" stroke="#cfd4dc"/>
    <text x="40" y="482" font-size="14" fill="#1b2430">7:30 · morning message at 8:00</text>
    <rect x="24" y="680" width="312" height="52" rx="14" fill="#2f7d5b"/>
    <text x="180" y="712" font-size="15" text-anchor="middle" fill="#fff" font-weight="600">Next</text>
  </g>

  <!-- screen B -->
  <g transform="translate(420,60)">
    <rect width="360" height="760" rx="18" fill="#ffffff" stroke="#cfd4dc"/>
    <text x="24" y="60" font-size="11" fill="#7d8794" letter-spacing="1">2 / 3 · WHO IS NEARBY</text>
    <text x="24" y="100" font-size="22" fill="#1b2430" font-weight="600">Two people you'd</text>
    <text x="24" y="128" font-size="22" fill="#1b2430" font-weight="600">call first</text>
    <text x="24" y="156" font-size="12" fill="#7d8794">If Mom ever goes quiet. We ask their consent once.</text>
    <rect x="24" y="180" width="312" height="70" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="40" y="206" font-size="13" fill="#1b2430" font-weight="600">Aunt Val</text>
    <text x="40" y="228" font-size="12" fill="#7d8794">neighbour · +7 ···</text>
    <rect x="24" y="262" width="312" height="70" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="40" y="288" font-size="13" fill="#1b2430" font-weight="600">Igor</text>
    <text x="40" y="310" font-size="12" fill="#7d8794">cousin · same town</text>
    <text x="24" y="370" font-size="11" fill="#7d8794" letter-spacing="1">INVITE THE FAMILY</text>
    <rect x="24" y="382" width="312" height="60" rx="12" fill="#ffffff" stroke="#cfd4dc"/>
    <text x="40" y="418" font-size="13" fill="#1b2430">Mia, Sam, Igor · invite link</text>
    <text x="24" y="470" font-size="12" fill="#7d8794">Grandchildren send the most. Invite them first.</text>
    <rect x="24" y="680" width="312" height="52" rx="14" fill="#2f7d5b"/>
    <text x="180" y="712" font-size="15" text-anchor="middle" fill="#fff" font-weight="600">Next</text>
  </g>

  <!-- screen C -->
  <g transform="translate(820,60)">
    <rect width="360" height="760" rx="18" fill="#ffffff" stroke="#cfd4dc"/>
    <text x="24" y="60" font-size="11" fill="#7d8794" letter-spacing="1">3 / 3 · HOW SHE GETS HER MORNING</text>
    <text x="24" y="100" font-size="22" fill="#1b2430" font-weight="600">Nothing for her</text>
    <text x="24" y="128" font-size="22" fill="#1b2430" font-weight="600">to install</text>
    <text x="24" y="156" font-size="12" fill="#7d8794">Pick where Mom already is.</text>
    <rect x="24" y="180" width="312" height="52" rx="12" fill="#e3f1ea" stroke="#2f7d5b"/>
    <text x="40" y="212" font-size="14" fill="#1b2430">Telegram</text>
    <rect x="24" y="242" width="312" height="52" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="40" y="274" font-size="14" fill="#1b2430">WhatsApp</text>
    <rect x="24" y="304" width="312" height="52" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="40" y="336" font-size="14" fill="#1b2430">LINE · MAX · Viber</text>
    <rect x="24" y="366" width="312" height="52" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="40" y="398" font-size="14" fill="#1b2430">The Vela app (I'll set it up for her)</text>
    <rect x="24" y="450" width="312" height="120" rx="12" fill="#fbf0d8" stroke="#e0a23a"/>
    <text x="40" y="478" font-size="11" fill="#7d8794" letter-spacing="1">SEND HER THE LINK WITH A FEW WORDS</text>
    <text x="40" y="504" font-size="12" fill="#1b2430">"Mom, I'm far away and I miss you. Every</text>
    <text x="40" y="522" font-size="12" fill="#1b2430">morning you'll get something from us. Tap</text>
    <text x="40" y="540" font-size="12" fill="#1b2430">'I'm fine' and I can breathe. Say 'stop'</text>
    <text x="40" y="558" font-size="12" fill="#1b2430">and it all switches off."</text>
    <rect x="24" y="680" width="312" height="52" rx="14" fill="#2f7d5b"/>
    <text x="180" y="712" font-size="15" text-anchor="middle" fill="#fff" font-weight="600">Send the invite</text>
  </g>
</svg>
