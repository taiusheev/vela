<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Helvetica, Arial, sans-serif">
  <rect width="390" height="844" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="20" y="40" font-size="11" fill="#7d8794">02 · SEND (queue something for her arrival)</text>
  <text x="20" y="84" font-size="22" fill="#1b2430" font-weight="600">What to send Mom?</text>

  <!-- prompt from her words -->
  <rect x="20" y="110" width="350" height="86" rx="12" fill="#fbf0d8" stroke="#e0a23a"/>
  <text x="36" y="136" font-size="11" fill="#7d8794" letter-spacing="1">PROMPT · FROM HER OWN WORDS</text>
  <text x="36" y="160" font-size="13" fill="#1b2430">On Tuesday she said the tomatoes are ripening.</text>
  <text x="36" y="180" font-size="13" fill="#1b2430">Ask her for a photo of the garden.</text>

  <!-- input kinds -->
  <g>
    <rect x="20" y="220" width="108" height="110" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <circle cx="74" cy="262" r="20" fill="#2f7d5b"/>
    <text x="74" y="267" font-size="14" text-anchor="middle" fill="#fff">🎤</text>
    <text x="74" y="306" font-size="12" text-anchor="middle" fill="#1b2430">Voice</text>
    <text x="74" y="321" font-size="10" text-anchor="middle" fill="#7d8794">10 seconds</text>
  </g>
  <g>
    <rect x="141" y="220" width="108" height="110" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <rect x="175" y="242" width="40" height="40" rx="8" fill="#e8ecf1"/>
    <text x="195" y="306" font-size="12" text-anchor="middle" fill="#1b2430">Photo</text>
    <text x="195" y="321" font-size="10" text-anchor="middle" fill="#7d8794">no caption needed</text>
  </g>
  <g>
    <rect x="262" y="220" width="108" height="110" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="316" y="270" font-size="22" text-anchor="middle" fill="#4a5566">?</text>
    <text x="316" y="306" font-size="12" text-anchor="middle" fill="#1b2430">Question</text>
    <text x="316" y="321" font-size="10" text-anchor="middle" fill="#7d8794">she answers in the morning</text>
  </g>

  <!-- text box -->
  <rect x="20" y="352" width="350" height="96" rx="12" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="36" y="380" font-size="13" fill="#7d8794">Or a few words…</text>
  <text x="36" y="432" font-size="11" fill="#7d8794">Translated for Mia if she answers in Russian.</text>

  <!-- when -->
  <text x="20" y="490" font-size="11" fill="#7d8794" letter-spacing="1">WHEN</text>
  <rect x="20" y="502" width="170" height="44" rx="10" fill="#2f7d5b"/>
  <text x="105" y="530" font-size="13" text-anchor="middle" fill="#fff">Tomorrow morning</text>
  <rect x="200" y="502" width="170" height="44" rx="10" fill="#f6f7f9" stroke="#e8ecf1"/>
  <text x="285" y="530" font-size="13" text-anchor="middle" fill="#4a5566">Whenever</text>

  <!-- turns -->
  <rect x="20" y="580" width="350" height="70" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
  <text x="36" y="606" font-size="12" fill="#1b2430" font-weight="600">This week's turns</text>
  <text x="36" y="628" font-size="12" fill="#4a5566">Mon Anna · Tue Mia · Wed Sam · Thu Anna · Fri Igor · Sat — · Sun story day</text>

  <rect x="20" y="760" width="350" height="56" rx="14" fill="#2f7d5b"/>
  <text x="195" y="794" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="600">Into her morning</text>
</svg>
