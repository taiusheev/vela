<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="1200" height="640" fill="#FBF7F0"/>
  <text x="40" y="44" font-size="13" fill="#7A7267" letter-spacing="1.5">VELA · THE KEPT LIGHT · working mark from the identity research · 2026-09-12</text>

  <!-- mark, full colour -->
  <g transform="translate(60,90)">
    <text x="0" y="0" font-size="12" fill="#7A7267">full colour</text>
    <rect x="24" y="20" width="112" height="140" rx="26" fill="none" stroke="#1E1A16" stroke-width="14"/>
    <ellipse cx="80" cy="66" rx="24" ry="20" fill="#E9A23B" opacity="0.22"/>
    <ellipse cx="80" cy="66" rx="14" ry="11" fill="#E9A23B"/>
  </g>
  <!-- silhouette -->
  <g transform="translate(240,90)">
    <text x="0" y="0" font-size="12" fill="#7A7267">one colour (Android tint, Apple tinted)</text>
    <path fill-rule="evenodd" fill="#1E1A16" d="M50 20 h60 a26 26 0 0 1 26 26 v88 a26 26 0 0 1 -26 26 h-60 a26 26 0 0 1 -26 -26 v-88 a26 26 0 0 1 26 -26 z M80 55 a14 11 0 1 0 0.01 0 z"/>
  </g>
  <!-- reversed -->
  <g transform="translate(470,90)">
    <text x="0" y="0" font-size="12" fill="#7A7267">reversed</text>
    <rect x="0" y="12" width="160" height="160" rx="30" fill="#1B1714"/>
    <rect x="48" y="34" width="64" height="112" rx="18" fill="none" stroke="#F3EDE4" stroke-width="10"/>
    <ellipse cx="80" cy="70" rx="20" ry="16" fill="#E9A23B" opacity="0.3"/>
    <ellipse cx="80" cy="70" rx="11" ry="9" fill="#E9A23B"/>
  </g>
  <!-- app icon -->
  <g transform="translate(680,90)">
    <text x="0" y="0" font-size="12" fill="#7A7267">app icon</text>
    <rect x="0" y="12" width="160" height="160" rx="36" fill="#FBF7F0" stroke="#E8E1D6"/>
    <rect x="52" y="40" width="56" height="100" rx="16" fill="#1E1A16"/>
    <ellipse cx="80" cy="72" rx="20" ry="16" fill="#E9A23B" opacity="0.35"/>
    <ellipse cx="80" cy="72" rx="10" ry="8" fill="#E9A23B"/>
  </g>
  <!-- small sizes -->
  <g transform="translate(890,120)">
    <text x="0" y="-30" font-size="12" fill="#7A7267">32 px · 64 px</text>
    <g transform="scale(0.2)"><rect x="24" y="20" width="112" height="140" rx="26" fill="none" stroke="#1E1A16" stroke-width="16"/><ellipse cx="80" cy="66" rx="16" ry="13" fill="#E9A23B"/></g>
    <g transform="translate(50,0) scale(0.4)"><rect x="24" y="20" width="112" height="140" rx="26" fill="none" stroke="#1E1A16" stroke-width="14"/><ellipse cx="80" cy="66" rx="24" ry="20" fill="#E9A23B" opacity="0.22"/><ellipse cx="80" cy="66" rx="14" ry="11" fill="#E9A23B"/></g>
  </g>

  <!-- wordmark lockup -->
  <g transform="translate(60,300)">
    <text x="0" y="0" font-size="12" fill="#7A7267">lockup · wordmark in Literata SemiBold</text>
    <rect x="12" y="24" width="56" height="72" rx="14" fill="none" stroke="#1E1A16" stroke-width="8"/>
    <ellipse cx="40" cy="48" rx="12" ry="10" fill="#E9A23B" opacity="0.22"/>
    <ellipse cx="40" cy="48" rx="7" ry="6" fill="#E9A23B"/>
    <text x="92" y="86" font-family="Literata, 'Noto Serif', Georgia, serif" font-weight="600" font-size="72" fill="#1E1A16" letter-spacing="-1">Vela</text>
  </g>

  <!-- the in-app light states -->
  <g transform="translate(560,300)">
    <text x="0" y="0" font-size="12" fill="#7A7267">the light, in the app (28 pt)</text>
    <g transform="translate(0,20)">
      <rect x="6" y="2" width="20" height="26" rx="6" fill="none" stroke="#1E1A16" stroke-width="2.5"/><ellipse cx="16" cy="11" rx="6" ry="5" fill="#E9A23B" opacity="0.3"/><ellipse cx="16" cy="11" rx="3.5" ry="3" fill="#E9A23B"/>
      <text x="0" y="52" font-size="11" fill="#5A534B">lit</text>
    </g>
    <g transform="translate(80,20)">
      <rect x="6" y="2" width="20" height="26" rx="6" fill="none" stroke="#7A7267" stroke-width="2.5"/>
      <text x="0" y="52" font-size="11" fill="#5A534B">resting</text>
    </g>
    <g transform="translate(160,20)">
      <rect x="6" y="2" width="20" height="26" rx="6" fill="none" stroke="#7A7267" stroke-width="2.5"/><circle cx="27" cy="3" r="4" fill="#C27612"/>
      <text x="0" y="52" font-size="11" fill="#5A534B">quiet</text>
    </g>
    <g transform="translate(240,20)">
      <rect x="6" y="2" width="20" height="26" rx="6" fill="none" stroke="#7A7267" stroke-width="2.5" stroke-dasharray="3 3"/>
      <text x="0" y="52" font-size="11" fill="#5A534B">away</text>
    </g>
  </g>

  <!-- palette -->
  <g transform="translate(60,440)">
    <text x="0" y="0" font-size="12" fill="#7A7267">palette · Candle &amp; Ink</text>
    <g transform="translate(0,14)">
      <rect width="56" height="56" rx="12" fill="#FBF7F0" stroke="#E8E1D6"/><text x="0" y="74" font-size="11" fill="#5A534B">bg FBF7F0</text>
      <rect x="70" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#E8E1D6"/><text x="70" y="74" font-size="11" fill="#5A534B">surface FFFFFF</text>
      <rect x="140" width="56" height="56" rx="12" fill="#1E1A16"/><text x="140" y="74" font-size="11" fill="#5A534B">ink 1E1A16</text>
      <rect x="210" width="56" height="56" rx="12" fill="#5A534B"/><text x="210" y="74" font-size="11" fill="#5A534B">ink-2 5A534B</text>
      <rect x="280" width="56" height="56" rx="12" fill="#E9A23B"/><text x="280" y="74" font-size="11" fill="#5A534B">light E9A23B</text>
      <rect x="350" width="56" height="56" rx="12" fill="#C27612"/><text x="350" y="74" font-size="11" fill="#5A534B">light-deep C27612</text>
      <rect x="420" width="56" height="56" rx="12" fill="#1F5C66"/><text x="420" y="74" font-size="11" fill="#5A534B">action 1F5C66</text>
      <rect x="490" width="56" height="56" rx="12" fill="#B3261E"/><text x="490" y="74" font-size="11" fill="#5A534B">error B3261E</text>
    </g>
    <text x="0" y="122" font-size="12" fill="#7A7267">type · Literata (people's words, wordmark) · Inter (interface) · Noto Serif TC / Noto Sans TC for Traditional Chinese</text>
    <text x="0" y="156" font-family="Literata, Georgia, serif" font-size="26" fill="#1E1A16">"Look how tall she is. Off to the garden today."</text>
    <text x="0" y="186" font-size="17" fill="#1E1A16">Mom answered at 8:12 · Tomorrow is Anna's turn</text>
  </g>
</svg>
