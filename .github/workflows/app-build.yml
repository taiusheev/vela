name: app build

# Builds of the app on EAS (build plan 3.9), started by hand from the Actions tab: nothing here runs
# on a push, because the free plan allows a limited number of builds a month (expo.dev/pricing).
# The profiles are in `apps/app/eas.json`: `staging` installs from a link (an APK on Android, and on
# iPhones registered with `eas device:create`), `e2e` is the staging build for a simulator, where
# the Maestro flows run, and `testflight` goes to TestFlight and Google Play's internal track.
# The `trial` profile is iPhone-only and targets production; it requires a v* release tag and the
# founder-reviewed production environment. Other profiles use staging. EXPO_TOKEN is the Expo organisation's `github-actions`
# token (infra/README.md, section 9); the Apple and Google credentials stay with EAS.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options: [staging, e2e, testflight, trial]
        default: staging
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android

permissions:
  contents: read
  actions: read

concurrency:
  group: app-build
  cancel-in-progress: false

jobs:
  build:
    name: eas build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.profile == 'trial' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the trial commit to have green CI on main
        if: inputs.profile == 'trial'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag && [[ "$GITHUB_REF_NAME" == v* ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" | jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha and .event != "schedule")) | sort_by(.run_number, .run_attempt) | last | .status == "completed" and .conclusion == "success"'
      # Pinned to a commit, not a tag: these steps are handed EXPO_TOKEN.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Verify production trial tag and configuration
        if: inputs.profile == 'trial'
        env:
          PLATFORM: ${{ inputs.platform }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          test "$GITHUB_REF_TYPE" = tag && [[ "$GITHUB_REF_NAME" == v* ]]
          test "$PLATFORM" = ios
          [[ "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_live_* ]]
          curl -fsS https://vela.vela-light.workers.dev/v1/capabilities | jq -e '.pilot == true and .english_only == true and .telegram_first == true and .billing == false and .parent_app == false and .memory == false and .book == false'
      - run: pnpm check
      # The build runs on EAS's machines; this job only hands it over and does not wait for it.
      # A TestFlight build is submitted once it is done.
      - name: Start the build
        working-directory: apps/app
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          submit=""
          if [ "$PROFILE" = "testflight" ] || [ "$PROFILE" = "trial" ]; then submit="--auto-submit"; fi
          eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait $submit
