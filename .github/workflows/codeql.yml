name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 08:15 Taipei; review findings alongside the weekly update PRs.
    - cron: "15 0 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency audit (pnpm 11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      # Reads the committed lockfile, including dev tools, without executing installs.
      # Registry failures must fail this check rather than reporting a clean audit.
      - run: pnpm audit --audit-level high
