name: waitlist-proof

on:
  workflow_dispatch:
    inputs:
      target:
        description: Test the deployed production Worker first, then the public domain after cutover
        type: choice
        options: [production-worker, public-domain]
        required: true
        default: public-domain

permissions:
  contents: read
  actions: read

concurrency:
  group: production-waitlist-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require a tested release commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag && [[ "$GITHUB_REF_NAME" == v* ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" | jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | map(select(.head_sha == $sha and .event != "schedule")) | sort_by(.run_number, .run_attempt) | last | .status == "completed" and .conclusion == "success"'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove production signup and remove only generated synthetic rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VELA_DATABASE_ENVIRONMENT: production
          WAITLIST_PROOF_TARGET: ${{ inputs.target }}
        run: pnpm --filter @vela/db exec node scripts/waitlist-proof.ts
