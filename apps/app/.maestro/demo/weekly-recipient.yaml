url: ${APP_URL}
name: Reports and questions each stay with the selected parent
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/sunday
- assertVisible: "Mom answered 6 of 7 days."
- tapOn: "Dad"
- assertNotVisible: "Mom answered 6 of 7 days."
- openLink: ${APP_URL}/questions
- tapOn: "Dad"
- scrollUntilVisible:
    element: "Write your own story question for Sunday"
    direction: DOWN
- tapOn: "Write your own story question for Sunday"
- assertVisible: "A story question for Dad's Sunday morning"
- inputText: "What was your first job like?"
- tapOn: "Mom"
- scrollUntilVisible:
    element: "Write your own story question for Sunday"
    direction: DOWN
- tapOn: "Write your own story question for Sunday"
- assertVisible: "A story question for Mom's Sunday morning"
- assertNotVisible: 'What was your first job like\?'
