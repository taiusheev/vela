url: ${APP_URL}
name: Reports and planned questions each stay with the selected parent
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/sunday
- assertVisible: "Mom answered 6 of 7 days."
- tapOn: "Dad"
- assertNotVisible: "Mom answered 6 of 7 days."
- openLink: ${APP_URL}/questions
- tapOn: "Dad"
- assertVisible: "Write a question for Dad"
- tapOn: "Edit question or day"
- assertVisible: "Your question for Dad"
- tapOn:
    id: "Say it the way you would say it"
- eraseText: 42
- inputText: "What was your first job like?"
- tapOn: "Save changes"
- assertVisible: 'What was your first job like\?'
- tapOn: "Mom"
- assertVisible: "Write a question for Mom"
- assertNotVisible: 'What was your first job like\?'
- tapOn: "Edit question or day"
- assertVisible: "Your question for Mom"
- assertNotVisible: 'What was your first job like\?'
