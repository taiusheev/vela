# The English cohort keeps parents on Telegram: unavailable parent-phone setup is hidden, while
# privacy, separate health consent and Vela support's data-request/help routes remain visible.
url: ${APP_URL}
name: Privacy and help remain available while parent phone setup is deferred
tags:
  - demo
---
- launchApp
- tapOn: "You"
- tapOn: "Settings"
- assertNotVisible: "Set it up"
- scrollUntilVisible:
    element: "Read the privacy notice"
    direction: DOWN
- assertVisible: "Get help or request your data"
- assertVisible: "Service terms"
- assertVisible: "Your data and deletion"
- scrollUntilVisible:
    element: "Your parent can ask “what does the family see” in their own chat. Health-word sharing is their separate choice, and saying stop pauses their light."
    direction: DOWN
- assertNotVisible: "Ask the founder for access, correction, deletion, or to withdraw consent. Never include private family content in a support message."
- assertNotVisible: "Set it up"
- tapOn: "Get help or request your data"
- assertVisible: "Help"
- assertVisible: "Vela status"
- assertVisible: "This is an example. No live status is checked."
- assertVisible: "Trouble signing in?"
- scrollUntilVisible:
    element: "Email Vela support"
    direction: DOWN
- assertVisible: "Describe what went wrong and when it happened. Never send passwords, sign-in codes, private family messages or photos."
- assertVisible: "support@vela-light.com"
- scrollUntilVisible:
    element: "Back"
    direction: UP
- tapOn: "Back"
- assertVisible: "Settings"
