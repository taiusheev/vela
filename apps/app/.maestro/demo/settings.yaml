url: ${APP_URL}
name: Parent photo and invitation controls live on the parent's own page, opened from You
tags:
  - demo
---
- launchApp
- assertNotVisible: "Only on this device. Removed when you sign out."
- tapOn: "You"
- assertVisible: "Notifications, language, privacy, account"
- tapOn:
    id: "you-parent-.*"
- tapOn: "Photo and parent link"
- assertVisible: "Parent settings"
- assertVisible: "Add a photo of Mom"
- assertVisible: "Only on this device. Removed when you sign out."
- scrollUntilVisible:
    element: "An invitation for Mom"
    direction: DOWN
- assertVisible: "This is an example family. No invitation is created or sent."
- tapOn: "Back"
- assertVisible: "Is Mom away\\?"
