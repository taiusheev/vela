# Acknowledgement directly from Today; the demo cannot imply an actual provider send.
url: ${APP_URL}
name: Today heart takes one tap and labels its demo receipt
tags:
  - demo
---
- launchApp
- tapOn:
    css: '[data-testid="today-heart-x1"]'
- assertVisible: "Example · heart accepted"
- assertNotVisible: "Heart for Mom"
- tapOn:
    css: '[data-testid="today-reply-x1"]'
- assertVisible: "Say something short"
- assertVisible: "What the family said"
