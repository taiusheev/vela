# Acknowledgement directly from Today; the demo cannot imply an actual provider send.
url: ${APP_URL}
name: Today heart takes one tap and labels its demo receipt
tags:
  - demo
---
- launchApp
# By its accessible name: a CSS lookup waits minutes for the web page to settle.
- tapOn:
    id: "Heart for Mom"
# Sent is shown, not written: the heart fills, and only its spoken label says so.
- assertVisible:
    id: "Example · heart sent"
- assertNotVisible: "Example · heart sent"
- tapOn: "Talk with Mom"
- assertVisible: "Write to Mom"
- assertVisible: "Your words reach Mom's chat now, signed with your name. Tomorrow's morning question still comes as planned."
