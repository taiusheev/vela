# Memories the family keeps (ADR-50, ADR-51), in the demo: an organiser taps the heart on one of
# her memories, it is lit as kept, and the family book opens with it as a page signed by her.
url: ${APP_URL}
name: An organiser keeps a memory with the heart, and it is a page in the family book
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/exchanges
- assertVisible: "Little things worth remembering.*"
# On the web, Maestro's id is the accessible label; the newest memory's heart comes first.
- tapOn:
    id: "Keep this memory"
    index: 0
- assertVisible:
    id: "Kept in the family book"
- assertVisible: "Kept 1"
- tapOn:
    id: "The family book"
- assertVisible: "1 memory"
- assertVisible: "Kept by Mia"
- assertVisible: "— .*"
