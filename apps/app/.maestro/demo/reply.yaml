# A reply in the demo (A8): an exchange opens from a memory, and a reply shows under what the
# family said, with the caption that she will not hear a reply to an older day; so does a heart.
url: ${APP_URL}
name: A reply shows under what the family said
tags:
  - demo
---
- launchApp
- tapOn: "Memories"
# A memory opens in place; the way into the chat is at its foot.
- tapOn: ".*only Mia listened about the butter.*"
- tapOn: "Open in the chat"
- assertVisible: "What the family said"
- assertVisible: "The family sees it here. She will not hear it: her mornings read back only her latest day."
- tapOn: "Say something short"
- inputText: "Save me a pie"
- scrollUntilVisible:
    element: "Send"
    direction: DOWN
- tapOn: "Send"
- assertVisible: "You: Save me a pie"
- tapOn: "❤️ Heart"
- assertVisible: "You sent a heart"
