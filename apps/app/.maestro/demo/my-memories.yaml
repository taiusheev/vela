# Your memories in the demo (privacy-notice v7): read the exact question, allow, keep one
# suggestion, then turn off and clear. Synthetic words only; nothing leaves the browser.
url: ${APP_URL}
name: A person allows memory suggestions, keeps words, then turns it off and clears
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/you
- tapOn: "Your memories"
- assertVisible: "Memory suggestions are off"
- tapOn: "Read the question"
- assertVisible: "Would you like Vela to suggest memories from your answers?"
- assertVisible: "Only new answers you send after agreeing are used."
- tapOn: "Allow memory suggestions"
- assertVisible: "Suggested for you"
- tapOn:
    text: "Keep these words"
    index: 0
- assertVisible: "Keep these words?"
- assertVisible: "Only these words will stay in your private memories.*"
- tapOn:
    text: "Keep these words"
    index: 0
- assertVisible: "Kept. Only you can see these words."
- assertVisible: "Kept on .*"
- tapOn: "Turn off and clear"
- assertVisible: "Turn off and clear your memories?"
- tapOn:
    text: "Turn off and clear"
    index: 0
- assertVisible: "Your memory permission and copies have been cleared in Vela."
- assertNotVisible: "Kept on .*"
