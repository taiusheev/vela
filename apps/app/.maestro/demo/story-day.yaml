url: ${APP_URL}
name: Questions has one flow and Sunday questions stay editable
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/questions
- assertVisible: "Planned questions"
- assertNotVisible: "Ask it on Sunday"
- assertNotVisible: "Read the family book"
- tapOn: "Edit question or day"
- assertVisible: "Edit question"
- tapOn:
    id: "Say it the way you would say it"
- eraseText: 52
- inputText: "Mom, how did you learn to make soup?"
- tapOn: "Save changes"
- assertVisible: "Question saved. You can adjust it below."
- assertVisible: 'Mom, how did you learn to make soup\?'
- tapOn: "Remove question"
- assertVisible: "Remove this planned question?"
- tapOn: "Keep question"
- assertVisible: 'Mom, how did you learn to make soup\?'
- tapOn: "Remove question"
- tapOn: "Yes, remove question"
- assertNotVisible: 'Mom, how did you learn to make soup\?'
- assertVisible: "Write a question for Mom"
