# Story day in the explicit demo (A10): questions can be chosen and edited without promising
# long-term retention or offering an unavailable book. Sending still requires the live API.
url: ${APP_URL}
name: Story questions can be chosen and edited without a retention promise
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/questions
- scrollUntilVisible:
    element: "Tell me about a day from when you were little that you still remember clearly. I'd love to hear it."
    direction: DOWN
- assertVisible: "Like Mom's other answers, it is kept for 30 days, then deleted."
- assertNotVisible: "Mom's answer is kept in the family book, unless Mom says not to."
- scrollUntilVisible:
    element: "Another question"
    direction: DOWN
- tapOn: "Another question"
- scrollUntilVisible:
    element: "What was your first day at work like? Tell me everything you remember."
    direction: DOWN
- scrollUntilVisible:
    element: "Write your own question"
    direction: DOWN
- tapOn: "Write your own question"
- assertVisible: "Your question for Mom"
- inputText: "How did you learn to make soup?"
- assertVisible: 'How did you learn to make soup\?'
- tapOn: "Choose from the list"
- assertVisible: "What was your first day at work like? Tell me everything you remember."
- assertNotVisible: "Read the family book"
