# The parent surface in the demo (spec §14.2, ADR-35): an organiser on You sets her phone up, and
# it shows her morning in large type with her answers as large buttons; a tap is thanked.
url: ${APP_URL}
name: Her phone shows her morning large, and a tap answers it
tags:
  - demo
---
- launchApp
- tapOn: "You"
- scrollUntilVisible:
    element: "Set it up"
    direction: DOWN
- tapOn: "Set it up"
- tapOn: "Yes, this is Mom's phone"
- assertVisible: "Good morning, Mom. Mia asks: what did you have for breakfast?"
- assertVisible: "Rice porridge"
- assertVisible: "Or say it in your own words"
- tapOn: "Rice porridge"
- assertVisible: "Thank you. Mia knows you're fine."
