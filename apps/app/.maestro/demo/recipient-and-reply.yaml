# The recipient is explicit; changing it keeps words and resets the former parent's vote state.
url: ${APP_URL}
name: Choose a parent and reply directly from Today
tags:
  - demo
---
- launchApp
- tapOn: "Ask Mom something"
- tapOn: "Say it the way you would say it"
- inputText: "What is growing by your window?"
- assertVisible: "What is growing by your window?"
- tapOn: "Dad"
- assertVisible: "Ask Dad something"
- assertVisible: "What is growing by your window?"
- assertNotVisible: "What seeds did you save from last year's garden?"
- tapOn: "More ways to ask"
- tapOn: "A vote"
- assertVisible: "Option 1"
- tapOn: "Mom"
- assertVisible: "Ask Mom something"
- assertVisible: "What is growing by your window?"
- assertNotVisible: "Option 1"
- tapOn: "Back"
- tapOn: "Reply to Mom"
- tapOn: "Say something short"
- inputText: "Save some seeds for our next visit."
- tapOn: "Send"
- assertVisible: "You: Save some seeds for our next visit."
