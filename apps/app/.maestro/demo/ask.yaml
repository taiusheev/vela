url: ${APP_URL}
name: A personal question returns to its editable schedule
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/ask
- assertVisible: "Your question for Mom"
- tapOn:
    id: "Say it the way you would say it"
- inputText: "Mom, did the basil survive the rain?"
- assertVisible: "Keep it short, like a message you would send yourself."
- assertVisible: "When should it arrive?"
- tapOn: "Save question"
- assertVisible: "Questions"
- assertVisible: "Question saved. You can adjust it below."
- assertVisible: 'Mom, did the basil survive the rain\?'
