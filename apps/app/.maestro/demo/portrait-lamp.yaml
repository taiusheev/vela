# Real app demo: every parent has a conversation; a resting window retains its crossbars.
url: ${APP_URL}
name: Parent portraits keep answer lights separate from reading
tags:
  - demo
---
- launchApp
- assertVisible:
    css: '[data-testid="portrait-window-lit"]'
- tapOn:
    css: '[data-testid="parent-choice-m2"]'
- assertVisible:
    css: '[data-testid="portrait-window-unlit"]'
- assertVisible: "Talk with Dad"
- tapOn: "Talk with Dad"
- assertVisible:
    id: "More for Dad"
- tapOn: "Back"
- tapOn:
    css: '[data-testid="parent-choice-m1"]'
- tapOn: "Talk with Mom"
- assertVisible:
    id: "More for Mom"
- tapOn: "Back"
- assertVisible:
    css: '[data-testid="portrait-window-lit"]'
