url: ${APP_URL}
name: Morning settings preserve today and show the example confirmation
tags:
  - demo
---
- launchApp
- tapOn: "You"
- scrollUntilVisible:
    element: "Change Mom's morning"
    direction: DOWN
- tapOn: "Change Mom's morning"
- assertVisible: "Morning settings"
- assertVisible: "This is an example. No settings are sent to a family."
- assertVisible: "Times are in Asia/Taipei. Today's morning stays at 08:00. A new time starts tomorrow."
- tapOn:
    id: 'Morning time \(24-hour HH:MM\)'
- eraseText
- inputText: "24:00"
- assertVisible: "Enter a time such as 08:30 and choose a supported language."
- tapOn:
    id: 'Morning time \(24-hour HH:MM\)'
- eraseText
- inputText: "07:30"
- scrollUntilVisible:
    element: "Preview settings"
    direction: DOWN
- tapOn: "Preview settings"
- assertVisible: "Example settings previewed."
- tapOn: "Cancel"
- assertVisible: "You"
