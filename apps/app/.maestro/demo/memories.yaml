# Memories in the demo (ADR-51): her memories a week at a time, found by a word, and a story
# gathered from three mornings in her own words.
url: ${APP_URL}
name: Memories groups her memories by week, finds a word, and tells a story in her words
tags:
  - demo
---
- launchApp
# Opened by itself: Today stays mounted behind a tab it opened, and its words would count as shown.
- openLink: ${APP_URL}/exchanges
- assertVisible: "This week"
# The oldest example is twelve days old: always at least one calendar week back.
- assertVisible: "Last week|Week of .*"
- tapOn:
    id: "Search memories"
- inputText: "butter"
- assertVisible: ".*only Mia listened about the butter.*"
- assertNotVisible: ".*The tomatoes finally turned.*"
- eraseText
- tapOn: "Stories.*"
- assertVisible: ".*Last summer's tomatoes.*"
- tapOn: ".*Last summer's tomatoes.*"
- assertVisible: "Told across 3 mornings"
- assertVisible: "I saved the seeds from last summer's tomatoes in an envelope by the radio."
