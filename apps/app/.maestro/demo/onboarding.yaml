# Onboarding v2 ("One road"): her window lights up, then the newcomer enters private setup.
# The full wizard, privacy decision and completion are covered by the release browser journey.
url: ${APP_URL}
name: A newcomer sees her window light up before entering private setup
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/onboarding
- extendedWaitUntil:
    visible: "Keep a light on for Mom."
    timeout: 20000
- assertNotVisible: "Skip"
- assertVisible: "I already have an account"
- tapOn: "Start · about 3 minutes"

- assertVisible: "Who are you keeping a light on for?"
- assertVisible: "What you call them"
- assertVisible: "What they call you"
- assertVisible: "Your questions are signed with it."
- assertVisible: "Continue"
