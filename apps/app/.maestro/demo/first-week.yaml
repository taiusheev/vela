# Before a first read, Week says when it comes and offers immediate everyday support.
url: ${APP_URL}
name: Week before the first read offers support for the chosen parent
tags:
  - demo
---
- launchApp
- openLink: ${APP_URL}/sunday
- tapOn: "Dad"
- assertVisible: "Dad's first weekly read: .*"
- scrollUntilVisible:
    element: "Offer practical help"
    direction: DOWN
- assertVisible: "What would help this week.*"
- tapOn: "Offer practical help"
- assertVisible:
    id: "chat-input"
- assertVisible: "Your words reach Dad.*"
- assertVisible: "Could I help with a meal, an errand or getting somewhere this week.*"
- assertVisible: "Send now"
- assertNotVisible: "Example only. Nothing was sent."
