<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Figtree, 'Plus Jakarta Sans', Arial, sans-serif">
  <rect width="1200" height="760" fill="#F5F7FB"/>
  <text x="40" y="44" font-size="14" fill="#7A8499" letter-spacing="1.5">VELA · LOGO DIRECTIONS · 2026-09-12 · the light story, without the house</text>

  <!-- ===== A · The window light ===== -->
  <g transform="translate(40,80)">
    <text x="0" y="0" font-size="13" fill="#7A8499" letter-spacing="1.2">A · THE WINDOW LIGHT (recommended)</text>
    <text x="0" y="22" font-size="13" fill="#4A5678">A window with a light left on. Navy frame, one blue glow. Reads at 16 px; the app icon is the same idea inverted.</text>
    <!-- mark -->
    <g transform="translate(20,60)">
      <rect x="6" y="6" width="120" height="120" rx="30" fill="none" stroke="#0B1B4A" stroke-width="12"/>
      <circle cx="84" cy="84" r="30" fill="#2E6BE8" opacity="0.18"/>
      <circle cx="84" cy="84" r="16" fill="#2E6BE8"/>
    </g>
    <!-- wordmark lockup -->
    <g transform="translate(180,60)">
      <rect x="6" y="6" width="120" height="120" rx="30" fill="none" stroke="#0B1B4A" stroke-width="12"/>
      <circle cx="84" cy="84" r="30" fill="#2E6BE8" opacity="0.18"/>
      <circle cx="84" cy="84" r="16" fill="#2E6BE8"/>
      <text x="160" y="104" font-size="104" font-weight="600" fill="#0B1B4A" letter-spacing="-3">Vela</text>
    </g>
    <!-- app icon -->
    <g transform="translate(560,60)">
      <rect width="132" height="132" rx="30" fill="#0B1B4A"/>
      <circle cx="88" cy="88" r="40" fill="#6C9BFF" opacity="0.28"/>
      <circle cx="88" cy="88" r="26" fill="#6C9BFF" opacity="0.5"/>
      <circle cx="88" cy="88" r="15" fill="#FFFFFF"/>
      <text x="0" y="158" font-size="12" fill="#7A8499">app icon</text>
    </g>
    <!-- small sizes -->
    <g transform="translate(730,86)">
      <g transform="scale(0.25)"><rect x="6" y="6" width="120" height="120" rx="30" fill="none" stroke="#0B1B4A" stroke-width="14"/><circle cx="84" cy="84" r="18" fill="#2E6BE8"/></g>
      <g transform="translate(50,0) scale(0.5)"><rect x="6" y="6" width="120" height="120" rx="30" fill="none" stroke="#0B1B4A" stroke-width="12"/><circle cx="84" cy="84" r="30" fill="#2E6BE8" opacity="0.18"/><circle cx="84" cy="84" r="16" fill="#2E6BE8"/></g>
      <text x="0" y="96" font-size="12" fill="#7A8499">32 px · 64 px</text>
    </g>
    <!-- the light states (the in-app glyph derived from the mark) -->
    <g transform="translate(870,70)">
      <text x="0" y="0" font-size="12" fill="#7A8499">the light, in the app</text>
      <g transform="translate(0,16)">
        <circle cx="20" cy="20" r="18" fill="#2E6BE8" opacity="0.16"/><circle cx="20" cy="20" r="9" fill="#2E6BE8"/>
        <text x="0" y="58" font-size="11" fill="#4A5678">lit</text>
      </g>
      <g transform="translate(70,16)">
        <circle cx="20" cy="20" r="9" fill="none" stroke="#7A8499" stroke-width="2.5"/>
        <text x="0" y="58" font-size="11" fill="#4A5678">resting</text>
      </g>
      <g transform="translate(140,16)">
        <circle cx="20" cy="20" r="9" fill="none" stroke="#7A8499" stroke-width="2.5"/><circle cx="31" cy="9" r="4" fill="#2E6BE8"/>
        <text x="0" y="58" font-size="11" fill="#4A5678">quiet</text>
      </g>
      <g transform="translate(210,16)">
        <circle cx="20" cy="20" r="9" fill="none" stroke="#7A8499" stroke-width="2.5" stroke-dasharray="3 3"/>
        <text x="0" y="58" font-size="11" fill="#4A5678">away</text>
      </g>
    </g>
  </g>

  <!-- ===== B · The vigil (arc + light) ===== -->
  <g transform="translate(40,330)">
    <text x="0" y="0" font-size="13" fill="#7A8499" letter-spacing="1.2">B · THE VIGIL</text>
    <text x="0" y="22" font-size="13" fill="#4A5678">An arc kept over a light: someone watching over someone. Softer, more emotional; risks reading as a person icon at small sizes.</text>
    <g transform="translate(20,60)">
      <path d="M14 96 A52 52 0 0 1 118 96" fill="none" stroke="#0B1B4A" stroke-width="12" stroke-linecap="round"/>
      <circle cx="66" cy="100" r="28" fill="#2E6BE8" opacity="0.18"/>
      <circle cx="66" cy="100" r="15" fill="#2E6BE8"/>
    </g>
    <g transform="translate(180,60)">
      <path d="M14 96 A52 52 0 0 1 118 96" fill="none" stroke="#0B1B4A" stroke-width="12" stroke-linecap="round"/>
      <circle cx="66" cy="100" r="28" fill="#2E6BE8" opacity="0.18"/>
      <circle cx="66" cy="100" r="15" fill="#2E6BE8"/>
      <text x="160" y="104" font-size="104" font-weight="600" fill="#0B1B4A" letter-spacing="-3">Vela</text>
    </g>
    <g transform="translate(560,60)">
      <rect width="132" height="132" rx="30" fill="#0B1B4A"/>
      <path d="M30 86 A38 38 0 0 1 106 86" fill="none" stroke="#6C9BFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="68" cy="92" r="22" fill="#6C9BFF" opacity="0.35"/>
      <circle cx="68" cy="92" r="12" fill="#FFFFFF"/>
      <text x="0" y="158" font-size="12" fill="#7A8499">app icon</text>
    </g>
  </g>

  <!-- ===== C · The V-sail ===== -->
  <g transform="translate(40,560)">
    <text x="0" y="0" font-size="13" fill="#7A8499" letter-spacing="1.2">C · THE V</text>
    <text x="0" y="22" font-size="13" fill="#4A5678">The letter as a sail (vela) holding a light. Strong as a monogram; the "light" reads less clearly than A.</text>
    <g transform="translate(20,50)">
      <path d="M14 14 L66 122 L118 14" fill="none" stroke="#0B1B4A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="66" cy="52" r="22" fill="#2E6BE8" opacity="0.18"/>
      <circle cx="66" cy="52" r="12" fill="#2E6BE8"/>
    </g>
    <g transform="translate(180,50)">
      <path d="M14 14 L66 122 L118 14" fill="none" stroke="#0B1B4A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="66" cy="52" r="22" fill="#2E6BE8" opacity="0.18"/>
      <circle cx="66" cy="52" r="12" fill="#2E6BE8"/>
      <text x="160" y="104" font-size="104" font-weight="600" fill="#0B1B4A" letter-spacing="-3">Vela</text>
    </g>
    <g transform="translate(560,50)">
      <rect width="132" height="132" rx="30" fill="#0B1B4A"/>
      <path d="M30 30 L66 108 L102 30" fill="none" stroke="#6C9BFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="66" cy="58" r="10" fill="#FFFFFF"/>
      <text x="0" y="158" font-size="12" fill="#7A8499">app icon</text>
    </g>
  </g>

  <!-- palette -->
  <g transform="translate(870,340)">
    <text x="0" y="0" font-size="12" fill="#7A8499">palette (kept from your logo, plus warm paper)</text>
    <rect x="0" y="14" width="56" height="56" rx="12" fill="#0B1B4A"/><text x="0" y="86" font-size="11" fill="#4A5678">navy 0B1B4A</text>
    <rect x="70" y="14" width="56" height="56" rx="12" fill="#2E6BE8"/><text x="70" y="86" font-size="11" fill="#4A5678">light 2E6BE8</text>
    <rect x="140" y="14" width="56" height="56" rx="12" fill="#7FA6FF"/><text x="140" y="86" font-size="11" fill="#4A5678">sky 7FA6FF</text>
    <rect x="210" y="14" width="56" height="56" rx="12" fill="#E6EEFF"/><text x="210" y="86" font-size="11" fill="#4A5678">soft E6EEFF</text>
    <rect x="0" y="100" width="56" height="56" rx="12" fill="#FBF8F3" stroke="#DCE3F0"/><text x="0" y="172" font-size="11" fill="#4A5678">paper FBF8F3</text>
    <rect x="70" y="100" width="56" height="56" rx="12" fill="#F5F7FB" stroke="#DCE3F0"/><text x="70" y="172" font-size="11" fill="#4A5678">bg F5F7FB</text>
    <rect x="140" y="100" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#DCE3F0"/><text x="140" y="172" font-size="11" fill="#4A5678">surface FFFFFF</text>
    <rect x="210" y="100" width="56" height="56" rx="12" fill="#4A5678"/><text x="210" y="172" font-size="11" fill="#4A5678">ink-2 4A5678</text>
    <text x="0" y="210" font-size="12" fill="#7A8499">type: Figtree (interface, wordmark) · Fraunces (people's words)</text>
    <text x="0" y="232" font-size="30" font-weight="600" fill="#0B1B4A">Figtree SemiBold</text>
    <text x="0" y="268" font-size="26" font-family="Fraunces, Georgia, serif" fill="#0B1B4A">Fraunces, for her own words</text>
  </g>
</svg>
