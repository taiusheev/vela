<text x="1150" y="540" font-size="11" fill="#7A7267" text-anchor="middle">app icon · simplified (test both)</text>
<text x="40" y="640" font-size="11" fill="#7A7267" letter-spacing="1.6" font-weight="600">3 · WHICH WINDOW · THE ONE CHANGE FROM THE GENERATED OPTION</text>
<g transform="translate(80,670) scale(0.72)"><path d="M34 0H66A34 34 0 0 1 100 34V118A14 14 0 0 1 86 132H14A14 14 0 0 1 0 118V34A34 34 0 0 1 34 0Z" fill="url(#paneGlow)"/><line x1="50" y1="0" x2="50" y2="132" stroke="#1E1A16" stroke-width="6"/><line x1="0" y1="52" x2="100" y2="52" stroke="#1E1A16" stroke-width="6"/><path d="M34 0H66A34 34 0 0 1 100 34V118A14 14 0 0 1 86 132H14A14 14 0 0 1 0 118V34A34 34 0 0 1 34 0Z" fill="none" stroke="#1E1A16" stroke-width="11" stroke-linejoin="round"/></g>
<text x="116" y="790" font-size="12" fill="#1E1A16" text-anchor="middle" font-weight="600">A · soft arch</text>
<text x="116" y="808" font-size="11" fill="#7A7267" text-anchor="middle">recommended</text>
<g transform="translate(260,670) scale(0.72)"><path d="M0 50A50 50 0 0 1 100 50V118A14 14 0 0 1 86 132H14A14 14 0 0 1 0 118Z" fill="url(#paneGlow)"/><line x1="50" y1="0" x2="50" y2="132" stroke="#1E1A16" stroke-width="6"/><line x1="0" y1="52" x2="100" y2="52" stroke="#1E1A16" stroke-width="6"/><path d="M0 50A50 50 0 0 1 100 50V118A14 14 0 0 1 86 132H14A14 14 0 0 1 0 118Z" fill="none" stroke="#1E1A16" stroke-width="11" stroke-linejoin="round"/></g>
<text x="296" y="790" font-size="12" fill="#1E1A16" text-anchor="middle" font-weight="600">B · full arch (as generated)</text>
<text x="296" y="808" font-size="11" fill="#7A7267" text-anchor="middle">reads chapel; the cross reads medical</text>
<g transform="translate(440,670) scale(0.72)"><path d="M22 0H78A22 22 0 0 1 100 22V110A22 22 0 0 1 78 132H22A22 22 0 0 1 0 110V22A22 22 0 0 1 22 0Z" fill="url(#paneGlow)"/><line x1="50" y1="0" x2="50" y2="132" stroke="#1E1A16" stroke-width="6"/><line x1="0" y1="52" x2="100" y2="52" stroke="#1E1A16" stroke-width="6"/><path d="M22 0H78A22 22 0 0 1 100 22V110A22 22 0 0 1 78 132H22A22 22 0 0 1 0 110V22A22 22 0 0 1 22 0Z" fill="none" stroke="#1E1A16" stroke-width="11" stroke-linejoin="round"/></g>
<text x="476" y="790" font-size="12" fill="#1E1A16" text-anchor="middle" font-weight="600">C · rounded rectangle</text>
<text x="476" y="808" font-size="11" fill="#7A7267" text-anchor="middle">safe, but reads phone or card</text>
<text x="620" y="672" font-size="12.5" fill="#1E1A16" font-weight="600">What changed from the generated option 1, and why:</text>
<text x="620" y="691" font-size="12.5" fill="#5A534B" >· Top softened from a semicircle to a soft arch: warmth without the church window.</text>
<text x="620" y="710" font-size="12.5" fill="#5A534B" >· Transom moved up to 40%: four unequal panes read as a sash window, not a plus sign.</text>
<text x="620" y="729" font-size="12.5" fill="#5A534B" >· Wordmark set in Literata SemiBold (the system's serif), not a geometric sans.</text>
<text x="620" y="748" font-size="12.5" fill="#5A534B" >· Panes flat amber with one soft radial; halo only on cream and dark grounds.</text>
<text x="620" y="767" font-size="12.5" fill="#5A534B" >· Frame 11 units, muntins 6: the frame survives one-colour and 32 px.</text>
<text x="620" y="786" font-size="12.5" fill="#5A534B" ></text>
<text x="620" y="805" font-size="12.5" fill="#5A534B" >Options 2 and 3 (dark slab with a dot): rejected. They read as a doorbell,</text>
<text x="620" y="824" font-size="12.5" fill="#5A534B" >a phone, or a fingerprint sensor; the black mass fights the cream identity;</text>
<text x="620" y="843" font-size="12.5" fill="#5A534B" >and with the light removed, nothing is left.</text>
<text x="40" y="872" font-size="11" fill="#7A7267" >Source: tools/brand/logo-sheet.mjs · palette and type from design/design-system.md · vector master still to be drawn in Figma once the tool-call cap resets</text>
</svg>
