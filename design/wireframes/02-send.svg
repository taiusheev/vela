<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Helvetica, Arial, sans-serif">
  <rect width="390" height="844" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="20" y="40" font-size="11" fill="#7d8794">02 · SEND (queue something for her arrival)</text>
  <text x="20" y="84" font-size="22" fill="#1b2430" font-weight="600">Что отправить маме?</text>

  <!-- prompt from her words -->
  <rect x="20" y="110" width="350" height="86" rx="12" fill="#fbf0d8" stroke="#e0a23a"/>
  <text x="36" y="136" font-size="11" fill="#7d8794" letter-spacing="1">ПОДСКАЗКА · ИЗ ЕЁ СЛОВ</text>
  <text x="36" y="160" font-size="13" fill="#1b2430">Во вторник она сказала, что помидоры поспели.</text>
  <text x="36" y="180" font-size="13" fill="#1b2430">Попроси фото с грядки.</text>

  <!-- input kinds -->
  <g>
    <rect x="20" y="220" width="108" height="110" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <circle cx="74" cy="262" r="20" fill="#2f7d5b"/>
    <text x="74" y="267" font-size="14" text-anchor="middle" fill="#fff">🎤</text>
    <text x="74" y="306" font-size="12" text-anchor="middle" fill="#1b2430">Голосом</text>
    <text x="74" y="321" font-size="10" text-anchor="middle" fill="#7d8794">10 секунд</text>
  </g>
  <g>
    <rect x="141" y="220" width="108" height="110" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <rect x="175" y="242" width="40" height="40" rx="8" fill="#e8ecf1"/>
    <text x="195" y="306" font-size="12" text-anchor="middle" fill="#1b2430">Фото</text>
    <text x="195" y="321" font-size="10" text-anchor="middle" fill="#7d8794">без подписи ок</text>
  </g>
  <g>
    <rect x="262" y="220" width="108" height="110" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
    <text x="316" y="270" font-size="22" text-anchor="middle" fill="#4a5566">?</text>
    <text x="316" y="306" font-size="12" text-anchor="middle" fill="#1b2430">Вопрос</text>
    <text x="316" y="321" font-size="10" text-anchor="middle" fill="#7d8794">она ответит утром</text>
  </g>

  <!-- text box -->
  <rect x="20" y="352" width="350" height="96" rx="12" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="36" y="380" font-size="13" fill="#7d8794">Или пару слов…</text>
  <text x="36" y="432" font-size="11" fill="#7d8794">Переведём для Маши, если она ответит по-русски.</text>

  <!-- when -->
  <text x="20" y="490" font-size="11" fill="#7d8794" letter-spacing="1">КОГДА</text>
  <rect x="20" y="502" width="170" height="44" rx="10" fill="#2f7d5b"/>
  <text x="105" y="530" font-size="13" text-anchor="middle" fill="#fff">Завтра утром</text>
  <rect x="200" y="502" width="170" height="44" rx="10" fill="#f6f7f9" stroke="#e8ecf1"/>
  <text x="285" y="530" font-size="13" text-anchor="middle" fill="#4a5566">Когда-нибудь</text>

  <!-- who's turn -->
  <rect x="20" y="580" width="350" height="70" rx="12" fill="#f6f7f9" stroke="#e8ecf1"/>
  <text x="36" y="606" font-size="12" fill="#1b2430" font-weight="600">Очередь на неделю</text>
  <text x="36" y="628" font-size="12" fill="#4a5566">Пн Аня · Вт Маша · Ср Саша · Чт Аня · Пт Игорь · Сб —  · Вс история</text>

  <rect x="20" y="760" width="350" height="56" rx="14" fill="#2f7d5b"/>
  <text x="195" y="794" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="600">В её утро</text>
</svg>
