# React Native needs a flat node_modules: Metro resolves from the app directory upwards, and
# pnpm's isolated layout also asks Windows for symlinks it is not allowed to create. Hoisting is
# what Expo documents for pnpm monorepos.
nodeLinker: hoisted

packages:
  - apps/*
  - packages/*

# Native binaries that must run their install step. Every other dependency stays script-free.
allowBuilds:
  '@clerk/shared': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  utf-8-validate: false
  workerd: true

# Supply-chain guard: versions published in the last day are held back. To take a fresher release,
# list it under minimumReleaseAgeExclude with the reason.

# Patched transitive dependencies, scoped to affected versions so newer upstream
# releases are not downgraded. Reassess when the parent tools release their fixes.
overrides:
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  # Current Miniflare line only; future older versions must be reviewed by audit.
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # The Workers test pool uses the same Zod 4 API as the application.
  '@cloudflare/vitest-pool-workers>zod': 4.6.6
  'node-forge@>=1.0.0 <1.4.3': 1.4.3
  'vite@>=8.3.0 <8.3.3': 8.3.3
  # @expo/plist uses DOMParser/XMLSerializer's stable API; prebuild validates the upgrade.
  '@expo/plist>@xmldom/xmldom': 0.8.15
  'undici@>=7.0.0 <7.30.1': 7.30.1
  # Apple targets imports only AssetContents helpers; native prebuild verifies SDK 57's API.
  '@bacons/apple-targets>@expo/prebuild-config': 57.0.20
  # Xcode's legacy UUID dependency retains CommonJS imports on 11.1.1.
  '@bacons/xcode>uuid': 11.1.1
  # Reviewed synchronous/async glob API consumers; cancellation and asset discovery are tested.
  'glob@10.5.0': 14.0.3
  'glob@13.0.6': 14.0.3
  '@expo/fingerprint>minimatch': 11.0.4
  # The old Drizzle loader uses transform APIs, not the development server.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # The query-string patch bridges the patched decoder's ESM default export to CommonJS.
  'query-string@7.1.3>decode-uri-component': 0.5.1

# One version of every dependency across the monorepo. Change versions here only.
catalog:
  "@anthropic-ai/sdk": 0.125.0
  "@babel/parser": 7.29.9
  "@biomejs/biome": 2.5.13
  "@cloudflare/vitest-pool-workers": 0.22.0
  "@cloudflare/workers-types": 5.20260911.1
  "@electric-sql/pglite": 0.5.8
  "@electric-sql/pglite-socket": 0.2.11
  "@lingui/babel-plugin-lingui-macro": 6.8.0
  "@lingui/cli": 6.8.0
  "@lingui/core": 6.8.0
  "@lingui/format-po": 6.8.0
  "@lingui/metro-transformer": 6.8.0
  "@lingui/react": 6.8.0
  "@types/node": 22.20.2
  "@types/pg": 8.23.1
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  hono: 4.13.16
  jose: 6.2.12
  pg: 8.23.0
  pofile-ts: 4.0.3
  turbo: 2.10.12
  typescript: 7.0.2
  vitest: 4.1.12
  wrangler: 4.131.1
  zod: 4.6.6

# Pinned, reviewed Expo SDK 57 security/toolchain patches and Clerk migration dependencies.
# These compatible parent releases remove vulnerable Zod, merge and wallet dependencies.
# Lockfile integrity plus consumer regressions, prebuild and bundles verify this exact set.
# Future fresh versions must be reviewed explicitly instead of being added automatically.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@clerk/clerk-js@6.42.3'
  - '@clerk/expo@4.15.1'
  - '@clerk/react@6.18.6'
  - '@clerk/shared@4.44.1'
  - '@expo/cli@57.0.33'
  - '@expo/config-plugins@57.0.12'
  - '@expo/config@57.0.11'
  - '@expo/env@2.4.4'
  - '@expo/fingerprint@0.20.15'
  - '@expo/image-utils@0.11.7'
  - '@expo/inline-modules@0.1.9'
  - '@expo/local-build-cache-provider@57.0.10'
  - '@expo/log-box@57.0.5'
  - '@expo/metro-config@57.0.14'
  - '@expo/plist@0.8.2'
  - '@expo/prebuild-config@57.0.20'
  - '@expo/require-utils@57.0.7'
  - '@expo/router-server@57.0.15'
  - '@expo/schema-utils@57.0.3'
  - babel-preset-expo@57.0.17
  - expo-asset@57.0.21
  - expo-constants@57.0.23
  - expo-modules-autolinking@57.0.17
  - expo-modules-core@57.0.25
  - expo@57.0.32
  - '@expo/metro-runtime@57.0.18'
  - expo-glass-effect@57.0.5
  - expo-image-manipulator@57.0.22
